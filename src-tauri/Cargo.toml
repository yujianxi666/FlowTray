[package]
name = "flowtray"
version = "0.3.1"
edition = "2021"
description = "FlowTray 流转台 — 跨应用文件中转坞"
authors = ["FlowTray"]
license = "MIT"
default-run = "flowtray"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
global-hotkey = "0.7"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# `custom-protocol` embeds the built frontend into the executable. It is applied
# for release builds; development runs point the WebView at the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = true
panic = "abort"
